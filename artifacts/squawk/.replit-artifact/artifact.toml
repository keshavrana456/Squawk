kind = "web"
previewPath = "/"
title = "Squawk"
version = "1.0.0"
id = "artifacts/squawk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19926

[services.development]
run = "pnpm --filter @workspace/squawk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/squawk", "run", "build" ]
publicDir = "artifacts/squawk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19926"
BASE_PATH = "/"
